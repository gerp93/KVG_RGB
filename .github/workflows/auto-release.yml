name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-python-gui.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      app_name: KVG_RGB
      entry_point: kvg_rgb/gui.py
      windowed: true
      version_file: kvg_rgb/__init__.py
      extra_add_data: "kvg_rgb/templates:kvg_rgb/templates;kvg_rgb/static:kvg_rgb/static;kvg_rgb/scripts:kvg_rgb/scripts"
    permissions:
      contents: write
